<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이름없는 — Objects of Quiet Luxury</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap');
:root{--bg:#08090b;--panel:#111316;--line:#292d32;--text:#f3f3f0;--muted:#92979d;--silver:#c7cbd0;--gold:#c7a875}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans','Noto Sans KR',sans-serif;letter-spacing:-.02em}button{font:inherit;cursor:pointer}.topbar{height:76px;padding:0 6vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff12;position:absolute;z-index:5;top:0;left:0;right:0}.brand{font-size:20px;letter-spacing:.22em;font-weight:600}.ghost{border:1px solid #3a3d42;background:transparent;color:#eee;border-radius:999px;padding:10px 17px}.hero{min-height:100vh;display:grid;place-items:center;text-align:center;padding:120px 24px 70px;background:radial-gradient(ellipse at 50% 38%,#24272b,#111316 34%,#08090b 72%)}.eyebrow,.kicker{font-size:11px;letter-spacing:.42em;color:var(--gold);margin-bottom:25px}.hero h1{font-size:clamp(48px,8vw,100px);font-weight:500;letter-spacing:.18em;margin:0 0 22px}.hero p{color:#a9adb1;letter-spacing:.08em;font-size:13px;margin:0 0 42px}.primary{background:var(--silver);color:#101114;border:0;border-radius:999px;padding:16px 42px;font-weight:700}.section{display:none;padding:100px 5vw 120px}.section.active{display:block}.head{margin-bottom:38px}.head h2{font-size:clamp(28px,4vw,44px);font-weight:500;letter-spacing:.08em;margin:0}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:.2s}.card:hover{border-color:#555b62;transform:translateY(-3px)}.visual{height:0;padding-bottom:100%;position:relative;perspective:1000px;background:#191c20;overflow:hidden}.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s}.card.flipped .flip{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden}.face img{width:100%;height:100%;object-fit:cover}.back{transform:rotateY(180deg);background:linear-gradient(145deg,#22262b,#111316);padding:22px;display:flex;flex-direction:column;justify-content:center}.back small{color:var(--gold);letter-spacing:.3em}.back h3{font-weight:500}.back p{font-size:12px;line-height:1.8;color:#b4b8bd}.info{padding:17px}.titleRow{display:flex;justify-content:space-between;gap:8px}.name{font-size:14px;margin:0 0 8px}.price{font-size:13px;white-space:nowrap;color:var(--silver)}.meta{font-size:10px;color:var(--muted);margin-bottom:15px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card button{border:1px solid #3a3e44;background:transparent;color:#eee;border-radius:9px;padding:10px 4px;font-size:11px}.card button.detail{border-color:#6d604b;color:#d9c29d}.overlay{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:center;justify-content:center;padding:20px}.overlay.open{display:flex}.drawer{width:min(560px,100%);max-height:85vh;overflow:auto;background:#111316;border:1px solid #34383e;border-radius:24px;padding:28px}.drawerHead{display:flex;justify-content:space-between;align-items:center}.cartrow{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.cartrow img{width:64px;height:64px;object-fit:cover;border-radius:10px}.qty button{margin:8px 5px 0 0;background:#252a30;color:white;border:1px solid #454a50;border-radius:5px}.summary{display:flex;justify-content:space-between;padding:20px 0}.checkout{width:100%}.note{font-size:11px;color:var(--muted);line-height:1.7}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#eee;color:#111;padding:12px 20px;border-radius:30px;opacity:0;pointer-events:none}.toast.show{opacity:1}footer{border-top:1px solid #202328;padding:28px 5vw;color:#747a81;font-size:10px;display:flex;justify-content:space-between}
@media(max-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.info{padding:12px}.name{font-size:12px}.price{font-size:11px}.card button{font-size:10px}.back{padding:14px}.back p{font-size:10px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.visual{padding-bottom:78%}}
</style></head><body>
<header class="topbar"><div class="brand">이름없는</div><div><button class="ghost" id="home">HOME</button> <button class="ghost" id="cartBtn">장바구니 <span id="count">0</span></button></div></header>
<main><section class="hero" id="hero"><div><div class="eyebrow">OBJECTS OF QUIET LUXURY</div><h1>이름없는</h1><p>일상에 오래 남을, 조용하고 분명한 선택.</p><button class="primary" id="view">상품 보기</button></div></section>
<section class="section" id="products"><div class="head"><div class="kicker">CURATED COLLECTION</div><h2>상품 목록</h2></div><div class="grid" id="grid"></div></section></main>
<footer><span>이름없는</span><span>DESIGNED IN SILENCE · 2026</span></footer>
<div class="overlay" id="overlay"><div class="drawer"><div class="drawerHead"><h2>장바구니</h2><button class="ghost" id="close">닫기</button></div><div id="items"></div><div class="summary"><span>총 상품 금액</span><strong id="total">₩0</strong></div><button class="primary checkout" id="checkout">구매장소이동</button><p class="note">구매장소이동을 누르면 지정된 Discord 서버로 이동합니다. 실제 결제는 이 웹사이트에서 진행되지 않습니다.</p></div></div><div class="toast" id="toast"></div>
<script>
const products=[
['A형 프3비법',5200],['B형 프3비법',7800],['C형 프3비법',8300],['D형 프3비법',8700],['E형 프3비법',9800],['프3 어뷰징 비법',14200],['프로티어 어뷰징 비법',28000],['A형 경쟁비법',7500],['B형 경쟁비법',8500],['C형 경쟁비법',9500]
].map((x,i)=>({id:i+1,name:x[0],price:x[1],description:x[0]+' 상품입니다.',image:'https://images.unsplash.com/photo-1490312278390-ab64016e0aa9?auto=format&fit=crop&w=900&q=85'}));
const won=n=>'₩'+n.toLocaleString('ko-KR');let cart=JSON.parse(localStorage.getItem('ineomneun-cart')||'[]');const $=id=>document.getElementById(id);
function save(){localStorage.setItem('ineomneun-cart',JSON.stringify(cart));$('count').textContent=cart.reduce((s,x)=>s+x.qty,0)}
function notice(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
function draw(){ $('grid').innerHTML='';products.forEach(p=>{let c=document.createElement('article');c.className='card';c.innerHTML='<div class="visual"><div class="flip"><div class="face"><img loading="lazy" src="'+p.image+'" alt="'+p.name+'"></div><div class="face back"><small>PRODUCT STORY</small><h3>'+p.name+'</h3><p>'+p.description+'</p></div></div></div><div class="info"><div class="titleRow"><h3 class="name">'+p.name+'</h3><span class="price">'+won(p.price)+'</span></div><div class="meta">GAME GUIDE</div><div class="actions"><button class="add">장바구니 담기</button><button class="detail">상품 설명 보기</button></div></div>';c.querySelector('.add').onclick=()=>{let x=cart.find(x=>x.id===p.id);x?x.qty++:cart.push({id:p.id,qty:1});save();notice('장바구니에 담았습니다.')};c.querySelector('.detail').onclick=e=>{c.classList.toggle('flipped');e.target.textContent=c.classList.contains('flipped')?'상품 보기':'상품 설명 보기'};$('grid').append(c)})}
function drawCart(){let sum=0;$('items').innerHTML='';if(!cart.length)$('items').textContent='장바구니가 비어 있습니다.';cart.forEach(x=>{let p=products.find(p=>p.id===x.id);if(!p)return;sum+=p.price*x.qty;let d=document.createElement('div');d.className='cartrow';d.innerHTML='<img src="'+p.image+'"><div>'+p.name+'<br><small>'+won(p.price)+'</small><div class="qty"><button data-a="minus">−</button>'+x.qty+'<button data-a="plus">+</button> <button data-a="remove">삭제</button></div></div><strong>'+won(p.price*x.qty)+'</strong>' ;d.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.a==='plus')x.qty++;if(b.dataset.a==='minus')x.qty--;if(b.dataset.a==='remove'||x.qty<1)cart=cart.filter(y=>y.id!==x.id);save();drawCart()});$('items').append(d)});$('total').textContent=won(sum)}
$('view').onclick=()=>{$('hero').style.display='none';$('products').classList.add('active');scrollTo(0,0)};$('home').onclick=()=>{$('hero').style.display='grid';$('products').classList.remove('active');scrollTo(0,0)};$('cartBtn').onclick=()=>{drawCart();$('overlay').classList.add('open')};$('close').onclick=()=>$('overlay').classList.remove('open');$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').classList.remove('open')};$('checkout').onclick=()=>{if(!cart.length){notice('장바구니가 비어 있습니다.');return}location.href='https://discord.gg/4YBbXkGya'};draw();save();
</script></body></html>
